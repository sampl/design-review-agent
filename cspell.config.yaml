version: "0.2"
language: en
files:
  - "**/*.{md,yml,yaml,json,js,mjs,cjs,ts}"
ignorePaths:
  - "**/node_modules/**"
  - "**/dist/**"
  - github-action/vendor/
  - pnpm-lock.yaml
ignoreRegExpList:
  - '/"[^"\n]*%[^"\n]*"/g'
words:
  - Ajv
  - IDAT
  - IEND
  - IHDR
  - LOGNAME
  - Northstar
  - SHELLOPTS
  - ajv
  - bookmarkable
  - checkmark
  - checkmarks
  - cspell
  - describedby
  - esac
  - getent
  - haspopup
  - hoverable
  - jiti
  - labelledby
  - lockfiles
  - mkdtemp
  - nogroup
  - nonblank
  - nonvisual
  - noopener
  - noreferrer
  - nums
  - pnpm
  - privs
  - regid
  - reuid
  - runIssues
  - sampl
  - setpriv
  - sigusr
  - tseslint
  - unreviewed
  - viewports
  - esbuild
