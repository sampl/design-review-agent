name: Design review agent
description: Review a running application and package an evidence-backed design report.
inputs:
  openai-api-key:
    description: OpenAI API key supplied from a GitHub Actions secret.
    required: true
  app-url:
    description: Base HTTP URL of the application already running in this job.
    required: true
  paths:
    description: JSON array of root-relative routes to review.
    default: '["/"]'
  source-scope:
    description: Repository-relative source directory; scope guides inspection, not filesystem isolation.
    default: "."
  viewports:
    description: JSON array of viewport width/height objects.
    default: '[{"width":1440,"height":900},{"width":390,"height":844}]'
  review-focus:
    description: Optional additional review focus.
    default: ""
  timeout-minutes:
    description: Requested model review budget, from 1 to 30 minutes; the caller step timeout enforces runtime.
    default: "10"
  design-qa-artifact-directory-path:
    description: Optional new report directory whose parent already exists.
    default: ""
outputs:
  design-qa-artifact-directory-path:
    description: Local report or diagnostic directory to upload, including on review failure.
    value: ${{ steps.finalize.outputs.design-qa-artifact-directory-path }}
  review-status:
    description: complete, incomplete, or failed; design findings do not fail execution.
    value: ${{ steps.finalize.outputs.review-status }}
# This reusable Action supplies steps; the caller workflow chooses triggers and the runner.
runs:
  using: composite
  steps:
    # The customer workflow chooses the machine. We currently support Linux, so stop otherwise.
    - name: Check supported runner
      shell: bash
      env:
        SUPPORTED_RUNNER_OS: ${{ runner.os }}
      run: test "$SUPPORTED_RUNNER_OS" = Linux
    # Our helper is JavaScript, so make Node 24 available before preparing the review.
    - name: Set up Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: "24"
    - name: Install pinned browser runtime
      shell: bash
      env:
        DESIGN_REVIEW_ACTION_DIRECTORY_PATH: ${{ github.action_path }}
      run: |
        npm ci --prefix "$DESIGN_REVIEW_ACTION_DIRECTORY_PATH" --omit=dev --ignore-scripts
        node "$DESIGN_REVIEW_ACTION_DIRECTORY_PATH/node_modules/playwright/cli.js" install --with-deps chromium
    # The instructions name the checkout and scope; Codex reads relevant source itself.
    - name: Prepare design review
      id: prepare
      shell: bash
      env:
        DESIGN_REVIEW_ACTION_DIRECTORY_PATH: ${{ github.action_path }}
        CUSTOMER_REPOSITORY_DIRECTORY_PATH: ${{ github.workspace }}
        RUNNER_TEMPORARY_DIRECTORY_PATH: ${{ runner.temp }}
        DESIGN_QA_APP_URL: ${{ inputs.app-url }}
        DESIGN_QA_PATHS: ${{ inputs.paths }}
        DESIGN_QA_SOURCE_SCOPE: ${{ inputs.source-scope }}
        DESIGN_QA_VIEWPORTS: ${{ inputs.viewports }}
        DESIGN_QA_REVIEW_FOCUS: ${{ inputs.review-focus }}
        DESIGN_QA_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        REQUESTED_DESIGN_QA_ARTIFACT_DIRECTORY_PATH: ${{ inputs.design-qa-artifact-directory-path }}
      run: node "$DESIGN_REVIEW_ACTION_DIRECTORY_PATH/scripts/designReview.mjs" prepare "$CUSTOMER_REPOSITORY_DIRECTORY_PATH" "$RUNNER_TEMPORARY_DIRECTORY_PATH" "$DESIGN_QA_APP_URL" "$DESIGN_QA_PATHS" "$DESIGN_QA_SOURCE_SCOPE" "$DESIGN_QA_VIEWPORTS" "$DESIGN_QA_REVIEW_FOCUS" "$DESIGN_QA_TIMEOUT_MINUTES" "$REQUESTED_DESIGN_QA_ARTIFACT_DIRECTORY_PATH" "$GITHUB_OUTPUT"
    # Reuse upstream key proxy and privilege isolation; later steps cannot depend on sudo.
    - name: Run design review
      id: review
      uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        working-directory: ${{ github.workspace }}
        codex-home: ${{ steps.prepare.outputs.codexHome }}
        prompt-file: ${{ steps.prepare.outputs.promptFile }}
        # The model's final JSON is orchestration output; browser tools save separate evidence.
        output-file: ${{ steps.prepare.outputs.responseFile }}
        permission-profile: ":read-only"
        safety-strategy: drop-sudo
        codex-args: '["--ephemeral"]'
    # Trusted orchestration writes the artifact after Codex has finished with read-only tools.
    - name: Create design review artifact
      id: finalize
      if: ${{ always() && steps.prepare.outcome == 'success' }}
      shell: bash
      env:
        DESIGN_REVIEW_ACTION_DIRECTORY_PATH: ${{ github.action_path }}
        DESIGN_REVIEW_STATE_FILE: ${{ steps.prepare.outputs.stateFile }}
        DESIGN_REVIEW_CODEX_OUTCOME: ${{ steps.review.outcome }}
      run: node "$DESIGN_REVIEW_ACTION_DIRECTORY_PATH/scripts/designReview.mjs" finalize "$DESIGN_REVIEW_STATE_FILE" "$DESIGN_REVIEW_CODEX_OUTCOME" "$GITHUB_OUTPUT"
